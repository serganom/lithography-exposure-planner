[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lithography-exposure-planner"
version = "0.3.0"
description = "Cross-platform GDSII local-mark assignment and CON field sequencing for multi-field electron-beam lithography"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5,<7",
    "gdspy>=1.6.13,<2",
    "numpy>=1.24,<3",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.gui-scripts]
lithography-exposure-planner = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main", "app_info", "runtime"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*", "core*", "models*", "ui*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_core.py", "test_smoke.py", "test_regressions.py", "test_platform.py"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
